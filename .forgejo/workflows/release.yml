name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - renovate.json5
  workflow_dispatch:

# Renovate automerges unthrottled here, so two merges minutes apart would race
# to claim the same patch number in "Compute tag".
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: docker
    env:
      REGISTRY: git.macalinao.org
      IMAGE: jj/headlamp-agent-sandbox
      REGISTRY_USER: jj
      # dind is a sidecar in the runner pod; job containers are created by that
      # daemon, so they reach it on its bridge gateway rather than localhost
      # (which would be the job container itself).
      DOCKER_HOST: tcp://172.17.0.1:2375
      DOCKER_CLI_VERSION: 29.8.1
    steps:
      - uses: actions/checkout@v7

      # Lifecycle scripts run as root in the same container that later holds the registry token.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

      # The `docker` label maps to node:22-bookworm, which has node and git (so
      # checkout works) but no docker CLI.
      - name: Install docker CLI
        run: |
          set -eu
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz -C /usr/local/bin --strip-components=1 docker/docker

      # Same-day rebuilds take the next free patch number, so every build keeps its own tag.
      - name: Compute tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          day="$(date -u +'%Y.%-m%d')"
          token="$(curl -fsS --max-time 30 "https://$REGISTRY/v2/token?scope=repository:$IMAGE:pull&service=container_registry" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          last="$(curl -fsS --max-time 30 -H "Authorization: Bearer $token" "https://$REGISTRY/v2/$IMAGE/tags/list" \
            | { grep -o "\"$day\.[0-9]*\"" || true; } | tr -d '"' | cut -d. -f3 | sort -n | tail -n 1)"
          version="$day.$(( ${last:--1} + 1 ))"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$'; then
            echo "::error::computed version '$version' is not YYYY.MDD.P"
            exit 1
          fi
          ref="$REGISTRY/$IMAGE:${version}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $ref"

      - name: Build image
        run: |
          set -eu
          docker build -t "${{ steps.tag.outputs.ref }}" .

      # The image is inert — no entrypoint, no service — so the only thing worth proving is
      # that Headlamp's plugin pair is where -plugins-dir expects it, readable as the uid the
      # consuming initContainer runs as.
      - name: Smoke test image
        run: |
          set -eu
          docker run --rm --network none --user 100:101 --entrypoint /bin/sh \
            "${{ steps.tag.outputs.ref }}" -c \
            'test -s /plugin/headlamp-agent-sandbox/main.js &&
             test -s /plugin/headlamp-agent-sandbox/package.json &&
             test -s /plugin/headlamp-agent-sandbox/fonts/LICENSE.txt'

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::REGISTRY_TOKEN repo secret is not set"
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Push image
        run: |
          set -eu
          docker push "${{ steps.tag.outputs.ref }}"
