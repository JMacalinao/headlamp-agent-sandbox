name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

      - name: Determine registry host
        id: registry
        # Forgejo hands this over as the instance ROOT_URL, which carries a
        # trailing slash; an unstripped one renders the image ref with '//'.
        run: echo "host=$(echo '${{ github.server_url }}' | sed -E 's#^[a-z]+://##; s#/+$##')" >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ github.repository }}:${{ steps.tag.outputs.version }}
            ${{ steps.registry.outputs.host }}/${{ github.repository }}:latest
